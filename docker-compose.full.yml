services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techmind-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: techmind
      DB_USERNAME: techmind
      DB_PASSWORD: secret
      ADMIN_EMAIL: admin@techmind.local
      ADMIN_PASSWORD: change-me
      TECHMIND_DEMO_MODE: "true"
      AI_DRIVER: template
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - techmind_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: techmind-mysql-full
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-techmind}
      MYSQL_USER: ${DB_USERNAME:-techmind}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - techmind_mysql_full_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: techmind-phpmyadmin-full
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  techmind_mysql_full_data:
    name: techmind_mysql_full_data
  techmind_storage:
    name: techmind_storage
